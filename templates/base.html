{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <title>{% block title %}{% endblock %}</title>
        <link href="{% static 'favicon.ico' %}" rel="icon">
        <link href="{% static 'favicon.png' %}" rel="icon" type="image/png">
        <link href="{% static 'apple-touch-icon.png' %}" rel="apple-touch-icon">
        <!-- O Bootstrap 6 mantém a folha de estilos padrão inalterada na estrutura básica -->
        <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
        {% block extra_css %}{% endblock %}
    </head>

    <body>
        {% include 'components/navbar.html' %}
        {% include 'components/messages.html' %}
        {% block content %}{% endblock %}
        {% include 'components/footer.html' %}

        <!-- ATENÇÃO: type="module" é obrigatório no Bootstrap 6 para carregar os componentes JS corretamente -->
        <script src="{% static 'js/bootstrap.bundle.min.js' %}" type="module"></script>

        <!-- O script de tema também se beneficia de rodar como módulo ou script padrão isolado -->
        <script src="{% static 'js/change-theme-min.js' %}" type="module"></script>

        {% block extra_js %}{% endblock %}
    </body>
</html>
