{% extends "base.html" %}
{% block content %}
    <div class="container my-4">
        <h2>Confirmar exclusão</h2>
        <p>Tem certeza que deseja excluir<strong>{{ object }}</strong>? Essa ação não pode ser desfeita.</p>
        <form class="my-5" method="post">
            {% csrf_token %}
            <a class="btn btn-outline-secondary" href="{{ cancel_url }}">
                <i class="bi bi-arrow-left"></i>
                &nbsp;Voltar
            </a>
            <button class="btn btn-outline-danger float-end" type="submit">
                <i class="bi bi-trash3"></i>&nbsp;Sim, excluir
            </button>
        </form>
    </div>
{% endblock %}
